<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Fleet - Admin Console - RESQCARE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="container" style="margin: 1.5rem auto 2.5rem auto;">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1.25rem;">
      <div>
        <span style="font-size: 0.775rem; font-weight: 700; color: #dc2626; text-transform: uppercase;">Fleet Oversight</span>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-top: 0.2rem; margin-bottom: 0.2rem;">Ambulance Fleet Management</h1>
        <p style="color: #64748b; font-size: 0.845rem; margin: 0;">Register emergency response vehicles, track readiness, and manage gear specs</p>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button onclick="document.getElementById('add-ambulance-modal').classList.add('open')" class="btn btn-primary btn-sm">
          + Add New Ambulance
        </button>
        <a href="admin-dashboard.html" class="btn btn-outline btn-sm">Back</a>
      </div>
    </div>

    <!-- Fleet Table Card -->
    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Vehicle Number</th>
              <th>Specification</th>
              <th>Assigned Pilot / Driver</th>
              <th>Capacity</th>
              <th>Availability</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="ambulances-tbody">
            <tr><td colspan="6" style="text-align: center; padding: 2rem; color: #64748b;">Loading fleet records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Ambulance Modal -->
  <div id="add-ambulance-modal" class="modal-backdrop" onclick="if(event.target === this) this.classList.remove('open')">
    <div class="modal">
      <div class="modal-header">
        <h3 class="card-title">Add Vehicle to Fleet</h3>
        <button class="close-btn" onclick="document.getElementById('add-ambulance-modal').classList.remove('open')">&times;</button>
      </div>
      <form id="add-ambulance-form" onsubmit="AdminApp.handleAddAmbulance(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="ambNumber">Ambulance Plate / Unit ID *</label>
            <input type="text" id="ambNumber" class="form-control" placeholder="e.g. AMB-ICU-106" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ambType">Specification Type *</label>
              <select id="ambType" class="form-control" required>
                <option value="BASIC">BASIC (First Aid, Oxygen)</option>
                <option value="ALS">ALS (Cardiac, Defibrillator)</option>
                <option value="ICU" selected>ICU (Critical Care, Ventilator)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ambCapacity">Bed Capacity</label>
              <input type="number" id="ambCapacity" class="form-control" value="1" min="1" max="4">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="ambEquipment">Installed Medical Equipment</label>
            <textarea id="ambEquipment" class="form-control" placeholder="e.g. Portable Ventilator, ECG Monitor, Suction Machine, Stretcher..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('add-ambulance-modal').classList.remove('open')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save & Register Unit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminApp.initAmbulances();
    });
  </script>
</body>
</html>
