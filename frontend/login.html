<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESQCARE - Login</title>
  <meta name="description" content="Secure portal sign in for citizens, emergency drivers, and administrators in RESQCARE.">

  <!-- Typography & Styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

  <!-- Centered Login Card (No Navigation Bar) -->
  <main class="login-wrapper">
    <div class="login-card">
      
      <!-- Project Branding -->
      <div class="login-header">
        <div class="login-brand-title">
          RESQ<span class="accent-red">CARE</span>
        </div>
        <h1 class="login-heading" id="login-role-heading">Portal Sign-In</h1>
        <p class="login-subheading" id="login-role-subheading">
          Sign in to book ambulances, track emergency dispatches, or access operational controls
        </p>
      </div>

      <!-- Role Selection Tabs -->
      <div class="role-tabs" role="tablist" aria-label="Portal Selection">
        <button 
          type="button" 
          id="tab-btn-user" 
          class="role-tab-btn active" 
          role="tab" 
          aria-selected="true" 
          onclick="switchLoginRole('user')"
        >
          User Sign-In
        </button>
        <button 
          type="button" 
          id="tab-btn-driver" 
          class="role-tab-btn tab-driver" 
          role="tab" 
          aria-selected="false" 
          onclick="switchLoginRole('driver')"
        >
          Driver Login
        </button>
        <button 
          type="button" 
          id="tab-btn-admin" 
          class="role-tab-btn tab-admin" 
          role="tab" 
          aria-selected="false" 
          onclick="switchLoginRole('admin')"
        >
          Admin Login
        </button>
      </div>

      <!-- Live Feedback Alert Banner -->
      <div id="login-alert" class="login-alert alert-danger" role="alert" aria-live="polite"></div>

      <!-- Unified Form -->
      <form id="login-form" novalidate>
        <div class="login-form-group">
          <label for="login-identifier" id="label-identifier">Email or Username</label>
          <input 
            type="text" 
            id="login-identifier" 
            name="identifier" 
            class="login-input" 
            placeholder="Enter your registered email or username" 
            required 
            autofocus 
            autocomplete="username"
          >
          <span id="identifier-error" class="field-error-msg" style="display: none;"></span>
        </div>

        <div class="login-form-group">
          <label for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="login-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <button 
              type="button" 
              id="password-toggle-btn" 
              class="password-toggle" 
              aria-label="Show password"
              onclick="togglePasswordVisibility()"
            >
              Show
            </button>
          </div>
          <span id="password-error" class="field-error-msg" style="display: none;"></span>
        </div>

        <button type="submit" id="btn-login" class="btn-submit-login">
          Sign In
        </button>
      </form>

      <!-- Bottom Links -->
      <div class="login-links">
        <p style="margin: 0 0 0.5rem 0;">
          Don't have an account? <a href="register.html" id="link-register-page">Register here</a>
        </p>
        <div class="login-divider-links">
          <a href="index.html">Back to Home</a>
        </div>
      </div>

      <!-- Security / Role Notice -->
      <div class="login-security-notice">
        Authentication is validated securely against MySQL. Your authorized dashboard opens automatically based on server-verified roles.
      </div>

    </div>
  </main>

  <!-- Core Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
