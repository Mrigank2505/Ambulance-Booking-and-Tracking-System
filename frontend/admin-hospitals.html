<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Hospitals - Admin Console - RESQCARE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="container" style="margin: 1.5rem auto 2.5rem auto;">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1.25rem;">
      <div>
        <span style="font-size: 0.775rem; font-weight: 700; color: #dc2626; text-transform: uppercase;">Medical Network</span>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-top: 0.2rem; margin-bottom: 0.2rem;">Hospitals & Emergency Facilities</h1>
        <p style="color: #64748b; font-size: 0.845rem; margin: 0;">Manage linked trauma centers, casualty hotlines, and ICU bed status</p>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button onclick="document.getElementById('add-hospital-modal').classList.add('open')" class="btn btn-primary btn-sm">
          + Add New Hospital
        </button>
        <a href="admin-dashboard.html" class="btn btn-outline btn-sm">Back</a>
      </div>
    </div>

    <!-- Hospitals Table Card -->
    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Hospital Name</th>
              <th>Address</th>
              <th>Emergency Contact</th>
              <th>Trauma Capability</th>
              <th>ICU Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="hospitals-tbody">
            <tr><td colspan="6" style="text-align: center; padding: 2rem; color: #64748b;">Loading hospital records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Hospital Modal -->
  <div id="add-hospital-modal" class="modal-backdrop" onclick="if(event.target === this) this.classList.remove('open')">
    <div class="modal">
      <div class="modal-header">
        <h3 class="card-title">Add Hospital Facility</h3>
        <button class="close-btn" onclick="document.getElementById('add-hospital-modal').classList.remove('open')">&times;</button>
      </div>
      <form id="add-hospital-form" onsubmit="AdminApp.handleAddHospital(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="hospName">Hospital Name *</label>
            <input type="text" id="hospName" class="form-control" placeholder="e.g. Metro City General Hospital" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="hospAddress">Full Address *</label>
            <input type="text" id="hospAddress" class="form-control" placeholder="Street, Sector, City" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="hospPhone">Emergency Helpline Phone *</label>
            <input type="tel" id="hospPhone" class="form-control" placeholder="+1-800-108-0000" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="hospLat">Latitude Coordinate *</label>
              <input type="number" step="0.0001" id="hospLat" class="form-control" value="12.9716" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="hospLon">Longitude Coordinate *</label>
              <input type="number" step="0.0001" id="hospLon" class="form-control" value="77.5946" required>
            </div>
          </div>
          <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 600;">
              <input type="checkbox" id="hospEmergency" checked> 24/7 Trauma Ready
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 600;">
              <input type="checkbox" id="hospIcu" checked> ICU Beds Available
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('add-hospital-modal').classList.remove('open')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Hospital</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminApp.initHospitals();
    });
  </script>
</body>
</html>
