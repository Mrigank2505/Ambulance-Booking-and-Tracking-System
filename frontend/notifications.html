<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - RESQCARE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 720px; margin: 1.5rem auto 2.5rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.25rem;">
      <div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.2rem;">Notification Center</h1>
        <p style="color: #64748b; font-size: 0.845rem; margin: 0;">System status updates, dispatch milestones, and security alerts</p>
      </div>
      <div>
        <button onclick="NotificationsManager.markAllAsRead()" class="btn btn-outline btn-sm" style="font-size: 0.8125rem;">
          Mark All as Read
        </button>
      </div>
    </div>

    <div id="notifications-list">
      <div class="card" style="text-align: center; padding: 3rem; color: #64748b;">
        Loading alerts...
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar();
      if (!Auth.requireAuth()) return;
      NotificationsManager.loadNotificationsList();
    });
  </script>
</body>
</html>
