<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Notice - RESQCARE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 560px; margin: 5rem auto; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
      <div style="font-size: 0.85rem; font-weight: 800; color: #dc2626; text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.05em; background: #fef2f2; display: inline-block; padding: 0.35rem 0.75rem; border-radius: 99px; border: 1px solid #fecaca;">System Notice</div>
      <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">Unexpected Operation State</h1>
      <p style="color: #64748b; font-size: 1rem; margin-bottom: 2rem;" id="error-message">
        We encountered an unexpected condition while processing your dispatch action.
      </p>

      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-outline">Back to Home</a>
        <a href="dashboard.html" class="btn btn-primary">My Dashboard</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar();
      const params = new URLSearchParams(window.location.search);
      const msg = params.get('msg');
      if (msg) {
        document.getElementById('error-message').textContent = decodeURIComponent(msg);
      }
    });
  </script>
</body>
</html>
