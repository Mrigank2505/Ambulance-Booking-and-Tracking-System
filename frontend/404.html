<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found - RESQCARE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 560px; margin: 5rem auto; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
      <div style="font-size: 3rem; font-weight: 800; color: #dc2626; margin-bottom: 1rem; letter-spacing: -0.05em;">404</div>
      <h1 style="font-size: 2.25rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">Page Not Found</h1>
      <p style="color: #64748b; font-size: 1rem; margin-bottom: 2rem;">
        The emergency route or resource you are looking for does not exist or has been relocated.
      </p>

      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary">Return to Safety (Home)</a>
        <a href="booking.html" class="btn btn-danger btn-pulse">Book Ambulance</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar();
    });
  </script>
</body>
</html>
